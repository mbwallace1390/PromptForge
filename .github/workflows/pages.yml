name: Deploy to GitHub Pages

# Publishes the app at https://<owner>.github.io/PromptForge/ on every push to main.
# The repo keeps promptforge.html by that name; only the deployed copy is called index.html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          cp promptforge.html _site/index.html
          cp sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
