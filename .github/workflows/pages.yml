name: Deploy to GitHub Pages

# Publishes the app at https://<owner>.github.io/PromptForge/ on every push to main, once the test suite
# passes: a commit that breaks the app never replaces the working live copy.
# The repo keeps promptforge.html by that name; only the deployed copy is called index.html.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR tests cancel only earlier tests for the same PR, never a live deployment.
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: Playwright installs Chromium's system libraries per Ubuntu release, and ubuntu-latest moves to a
    # new release on GitHub's schedule. A move it does not support yet would block every deploy.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm ci runs the postinstall step, which downloads Playwright's Chromium.
      - run: npm ci
      - name: Install Chromium's system libraries
        run: npx playwright install-deps chromium
      - name: Run the test suite
        run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: |
          mkdir -p _site
          cp promptforge.html _site/index.html
          cp sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
